<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SteelCraft</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }

        .text-warning-custom {
            color: #ffc107;
        }

        .dashboard-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            margin-top: 2rem;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="text-warning-custom">Steel</span>Craft</a>
            <div class="d-flex ms-auto">
                <span class="navbar-text me-3 text-white" id="userGreeting">Loading...</span>
                <button class="btn btn-outline-warning btn-sm" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="dashboard-card">
                    <h2 class="mb-4">Welcome to Your Dashboard!</h2>
                    <p class="text-muted mb-4">You have successfully authenticated using Node.js, Express, MongoDB, and
                        JWT.</p>

                    <div class="alert alert-success">
                        <strong>Protected Route Validation:</strong> If you are seeing this page, you have a valid JWT
                        token stored in your localStorage.
                    </div>

                    <div class="mt-4">
                        <a href="index.html" class="btn btn-dark">Return to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Dashboard Specific Logic to protect route
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user'));

            // Redirect to login if no token
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            // Display user details
            if (user && user.name) {
                document.getElementById('userGreeting').textContent = `Hello, ${user.name}`;
            } else {
                document.getElementById('userGreeting').textContent = `Hello, User`;
            }
        });
    </script>
</body>

</html>
