<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SteelCraft</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-control:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
        }

        .btn-primary {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #000;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }

        .text-warning-custom {
            color: #ffc107;
        }
    </style>
</head>

<body>
    <div class="container auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <h2><span class="text-warning-custom">Steel</span>Craft</h2>
                <p class="text-muted">Welcome back! Please login to your account.</p>
            </div>

            <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3" id="loginBtn">Login</button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted">Don't have an account? <a href="register.html"
                        class="text-decoration-none text-warning-custom fw-bold">Register here</a></p>
                <p class="text-muted"><a href="index.html" class="text-decoration-none text-secondary">Back to Home</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
